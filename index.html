<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melodix — Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c27;--surface3:#252533;
  --accent:#1db954;--accent2:#1ed760;--purple:#a259ff;
  --text:#fff;--text2:#b3b3b3;--text3:#6a6a7a;
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text)}
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr 90px;height:100vh}
.sidebar{grid-row:1;background:var(--bg);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06);overflow:hidden}
.sidebar-top{padding:16px 12px 0;flex-shrink:0}
.sidebar-scroll{overflow-y:auto;flex:1;padding:0 12px 8px}
.sidebar-bottom{padding:8px 12px 12px;border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0}
.main{grid-row:1;background:var(--surface);overflow-y:auto;position:relative}
.player{grid-column:1/-1;background:#090909;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}

.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--accent);padding:8px 12px 16px;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px}
.logo-icon{width:28px;height:28px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:16px;height:16px;fill:#000}

.nav-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;padding:4px 12px 6px;font-family:'Syne',sans-serif}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;color:var(--text2);transition:all 0.15s;user-select:none}
.nav-item:hover{background:rgba(255,255,255,0.07);color:var(--text)}
.nav-item.active{background:rgba(29,185,84,0.12);color:var(--accent)}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:0.8}
.nav-item.active svg{opacity:1}

/* Sidebar playlist items */
.pl-section-header{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 6px}
.pl-section-header .nav-label{padding:0}
.pl-add-btn{background:none;border:none;cursor:pointer;color:var(--text3);display:flex;align-items:center;padding:2px;border-radius:4px;transition:color 0.15s}
.pl-add-btn:hover{color:var(--accent)}
.pl-add-btn svg{width:16px;height:16px}

.playlist-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text3);transition:all 0.15s;user-select:none;position:relative}
.playlist-item:hover{background:rgba(255,255,255,0.06);color:var(--text2)}
.playlist-item.active{color:var(--accent);background:rgba(29,185,84,0.08)}
.pl-thumb{width:36px;height:36px;border-radius:6px;flex-shrink:0;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;position:relative}
.pl-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pl-thumb.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}
.pl-thumb.mosaic span{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;background:var(--surface3)}
.pl-thumb.mosaic img{width:100%;height:100%;object-fit:cover}
.pl-info{flex:1;min-width:0}
.pl-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-count{font-size:11px;color:var(--text3)}
.pl-del-btn{background:none;border:none;cursor:pointer;color:var(--text3);opacity:0;padding:3px;border-radius:4px;display:flex;align-items:center;transition:all 0.15s;flex-shrink:0}
.playlist-item:hover .pl-del-btn{opacity:1}
.pl-del-btn:hover{color:#ff5555;background:rgba(255,85,85,0.12)}
.pl-del-btn svg{width:13px;height:13px}

/* Now Playing Sidebar Panel */
.now-playing-sidebar{padding:12px;margin-bottom:4px}
.nps-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-family:'Syne',sans-serif}
.nps-poster{width:100%;aspect-ratio:1;border-radius:10px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden;position:relative;margin-bottom:10px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.nps-poster img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.nps-track-name{font-size:14px;font-weight:600;font-family:'Syne',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.nps-track-artist{font-size:12px;color:var(--text3);margin-top:2px}

.main-header{padding:32px 32px 20px;background:linear-gradient(180deg,rgba(29,185,84,0.15) 0%,transparent 100%);position:sticky;top:0;z-index:10;backdrop-filter:blur(20px)}
.main-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}
.main-sub{font-size:13px;color:var(--text2)}

.tracks-header{display:grid;grid-template-columns:32px 1fr 160px 80px 80px 40px;gap:12px;padding:8px 12px;font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:4px}
.track-row{display:grid;grid-template-columns:32px 1fr 160px 80px 80px 40px;gap:12px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;align-items:center;transition:background 0.12s;user-select:none}
.track-row:hover{background:rgba(255,255,255,0.06)}
.track-row.playing{background:rgba(29,185,84,0.1)}
.track-num{font-size:13px;color:var(--text3);text-align:center;font-variant-numeric:tabular-nums}
.track-row.playing .track-num{color:var(--accent)}
.track-info{display:flex;align-items:center;gap:10px;min-width:0}
.track-art{width:36px;height:36px;border-radius:6px;flex-shrink:0;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;overflow:hidden}
.track-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.track-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.track-row.playing .track-name{color:var(--accent)}
.track-artist{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-album{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-dur{font-size:12.5px;color:var(--text3);font-variant-numeric:tabular-nums;text-align:right}
.track-add-pl{background:none;border:none;cursor:pointer;padding:4px;color:var(--text3);transition:color 0.15s;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;gap:3px;white-space:nowrap}
.track-add-pl:hover{color:var(--accent);background:rgba(29,185,84,0.1)}
.track-add-pl svg{width:14px;height:14px}
.like-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--text3);transition:color 0.15s;display:flex;align-items:center;justify-content:center}
.like-btn:hover,.like-btn.liked{color:var(--accent)}
.like-btn svg{width:15px;height:15px}

.playing-indicator{display:flex;gap:2px;align-items:flex-end;height:14px;justify-content:center}
.playing-indicator span{width:3px;background:var(--accent);border-radius:1px;animation:wave 1s ease-in-out infinite}
.playing-indicator span:nth-child(2){animation-delay:0.1s}
.playing-indicator span:nth-child(3){animation-delay:0.2s}
@keyframes wave{0%,100%{height:4px}50%{height:14px}}

/* Player bar */
.player-left{display:flex;align-items:center;gap:14px;width:280px;flex-shrink:0}
.now-art{width:52px;height:52px;border-radius:8px;flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative}
.now-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.now-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);max-width:160px}
.now-artist{font-size:12px;color:var(--text3)}
.now-like{background:none;border:none;cursor:pointer;color:var(--text3);transition:color 0.15s;padding:4px;display:flex}
.now-like:hover,.now-like.liked{color:var(--accent)}
.now-like svg{width:16px;height:16px}

.player-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:560px}
.controls{display:flex;align-items:center;gap:6px}
.ctrl-btn{background:none;border:none;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;padding:7px;border-radius:50%;transition:all 0.15s}
.ctrl-btn:hover{color:var(--text);background:rgba(255,255,255,0.08)}
.ctrl-btn.active{color:var(--accent)}
.ctrl-btn svg{width:18px;height:18px}
.play-btn{width:38px;height:38px;border-radius:50%;background:var(--text);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.12s,background 0.12s;flex-shrink:0}
.play-btn:hover{background:#e0e0e0;transform:scale(1.05)}
.play-btn:active{transform:scale(0.97)}
.play-btn svg{width:18px;height:18px;fill:#000}

.progress-row{display:flex;align-items:center;gap:10px;width:100%}
.time-label{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;min-width:32px}
.time-label:last-child{text-align:right}
.progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;cursor:pointer;position:relative;overflow:hidden;transition:height 0.1s}
.progress-bar:hover{height:6px}
.progress-fill{height:100%;background:var(--text);border-radius:2px;transition:width 0.25s linear;pointer-events:none}
.progress-bar:hover .progress-fill{background:var(--accent)}

.player-right{display:flex;align-items:center;gap:4px;width:200px;justify-content:flex-end;flex-shrink:0}
.vol-row{display:flex;align-items:center;gap:8px}
.vol-icon{color:var(--text2);display:flex;cursor:pointer}
.vol-icon svg{width:16px;height:16px}
.vol-bar input[type=range]{width:80px;height:4px;-webkit-appearance:none;appearance:none;cursor:pointer;accent-color:var(--accent)}

/* Queue panel */
.queue-panel{position:absolute;right:0;top:0;bottom:0;width:300px;background:#111118;border-left:1px solid rgba(255,255,255,0.07);transform:translateX(100%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);z-index:20;display:flex;flex-direction:column}
.queue-panel.open{transform:translateX(0)}
.queue-header{padding:20px;border-bottom:1px solid rgba(255,255,255,0.07);font-family:'Syne',sans-serif;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.close-queue{background:none;border:none;cursor:pointer;color:var(--text3);display:flex;padding:4px}
.close-queue:hover{color:var(--text)}
.close-queue svg{width:18px;height:18px}
.queue-list{overflow-y:auto;flex:1;padding:8px}
.q-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:background 0.12s}
.q-item:hover{background:rgba(255,255,255,0.06)}
.q-item.active{background:rgba(29,185,84,0.1)}
.q-art{width:36px;height:36px;border-radius:6px;flex-shrink:0;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;position:relative}
.q-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.q-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.q-item.active .q-name{color:var(--accent)}
.q-artist{font-size:11.5px;color:var(--text3)}
.q-dur{font-size:11.5px;color:var(--text3);flex-shrink:0}

/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 32px;text-align:center;gap:16px}
.empty-icon{font-size:64px;opacity:0.4}
.empty-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--text2)}
.empty-desc{font-size:13px;color:var(--text3);line-height:1.6;max-width:300px}
.empty-btn{background:var(--accent);color:#000;border:none;padding:10px 24px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:background 0.15s,transform 0.12s;display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.empty-btn:hover{background:var(--accent2);transform:scale(1.02)}
.empty-btn svg{width:14px;height:14px;fill:#000}

/* Search */
.search-bar{position:relative;margin:16px 32px 20px}
.search-bar input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:9px 16px 9px 40px;font-size:13.5px;color:var(--text);outline:none;font-family:'DM Sans',sans-serif;transition:border 0.15s}
.search-bar input:focus{border-color:rgba(29,185,84,0.5);background:rgba(255,255,255,0.1)}
.search-bar input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-icon svg{width:15px;height:15px}

.play-all-btn{background:var(--accent);color:#000;border:none;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:background 0.15s,transform 0.12s;display:inline-flex;align-items:center;gap:6px}
.play-all-btn:hover{background:var(--accent2);transform:scale(1.02)}
.play-all-btn svg{width:14px;height:14px;fill:#000}
.section-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;padding:0 32px 12px;letter-spacing:-0.3px}
.hero-tracks{padding:0 32px 32px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface2);border-radius:16px;padding:28px;width:380px;max-width:90vw;border:1px solid rgba(255,255,255,0.1);transform:scale(0.95);transition:transform 0.2s}
.modal-overlay.open .modal{transform:scale(1)}
.modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:20px}
.modal-input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);outline:none;font-family:'DM Sans',sans-serif;transition:border 0.15s;margin-bottom:16px}
.modal-input:focus{border-color:rgba(29,185,84,0.5)}
.modal-emoji-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.emoji-opt{width:36px;height:36px;border-radius:8px;border:2px solid transparent;background:rgba(255,255,255,0.06);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all 0.12s}
.emoji-opt:hover{background:rgba(255,255,255,0.12)}
.emoji-opt.selected{border-color:var(--accent);background:rgba(29,185,84,0.12)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-cancel{background:rgba(255,255,255,0.08);color:var(--text2);border:none;padding:9px 20px;border-radius:10px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s}
.modal-cancel:hover{background:rgba(255,255,255,0.14)}
.modal-confirm{background:var(--accent);color:#000;border:none;padding:9px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:background 0.15s}
.modal-confirm:hover{background:var(--accent2)}

/* Add to playlist dropdown */
.add-pl-dropdown{position:absolute;background:var(--surface2);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:6px;z-index:50;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.add-pl-opt{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2);transition:background 0.12s;display:flex;align-items:center;gap:8px}
.add-pl-opt:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.add-pl-opt.new{color:var(--accent)}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

/* Playlist view remove btn */
.remove-from-pl{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;display:flex;align-items:center;transition:color 0.15s;border-radius:4px}
.remove-from-pl:hover{color:#ff5555;background:rgba(255,85,85,0.12)}
.remove-from-pl svg{width:14px;height:14px}

/* ── Features: Sleep Timer + Playtime Calculator ── */
.features-wrap{padding:24px 28px 32px}
.feature-panel{background:var(--surface2);border-radius:14px;border:1px solid rgba(255,255,255,0.07);overflow:hidden;margin-bottom:16px}
.fp-header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px}
.fp-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fp-title{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--text)}
.fp-sub{font-size:11.5px;color:var(--text3);margin-top:1px}
.fp-body{padding:18px 20px}
.fp-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:0.4px;font-family:'Syne',sans-serif}
.fp-badge-green{background:rgba(29,185,84,0.15);color:var(--accent)}
.fp-badge-amber{background:rgba(245,158,11,0.15);color:#f59e0b}
.fp-badge-off{background:rgba(255,255,255,0.08);color:var(--text2)}
.fp-badge-blue{background:rgba(55,138,221,0.15);color:#378add}
.fp-section-lbl{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.9px;margin-bottom:10px}
.fp-divider{height:1px;background:rgba(255,255,255,0.06);margin:14px 0}
.timer-ring-wrap{display:flex;justify-content:center;margin-bottom:18px}
.ring-bg{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:8}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.5s ease,stroke 0.3s}
.ring-center-val{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;fill:var(--text);text-anchor:middle;dominant-baseline:middle}
.ring-center-lbl{font-size:11px;fill:var(--text3);text-anchor:middle;dominant-baseline:middle}
.timer-status-bar{background:var(--surface3);border-radius:9px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ts-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background 0.3s}
.ts-dot.ts-running{background:var(--accent);animation:tsblink 1.4s ease-in-out infinite}
.ts-dot.ts-ending{background:#f59e0b;animation:tsblink 0.6s ease-in-out infinite}
@keyframes tsblink{0%,100%{opacity:1}50%{opacity:0.25}}
.fp-presets-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.fp-preset{background:var(--surface3);border:1px solid rgba(255,255,255,0.07);border-radius:9px;padding:10px 6px;cursor:pointer;text-align:center;transition:all 0.15s;user-select:none}
.fp-preset:hover{background:rgba(255,255,255,0.1)}
.fp-preset.fp-active{background:rgba(29,185,84,0.12);border-color:rgba(29,185,84,0.35)}
.fp-preset .pv{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--text);display:block}
.fp-preset .pu{font-size:10.5px;color:var(--text3);display:block;margin-top:2px}
.fp-preset.fp-active .pv{color:var(--accent)}
.fp-preset.fp-active .pu{color:rgba(29,185,84,0.6)}
.fp-custom-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.fp-custom-row label{font-size:12.5px;color:var(--text2);min-width:90px;flex-shrink:0}
.fp-custom-row input[type=range]{flex:1;accent-color:var(--accent)}
.fp-val-badge{font-size:12.5px;color:var(--accent);font-weight:700;min-width:52px;text-align:right}
.fp-fade-row{display:flex;gap:8px;flex-wrap:wrap}
.fp-fade-chip{background:var(--surface3);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s}
.fp-fade-chip:hover{background:rgba(255,255,255,0.1);color:var(--text)}
.fp-fade-chip.fp-active{background:rgba(29,185,84,0.12);border-color:rgba(29,185,84,0.3);color:var(--accent)}
.fp-action-row{display:flex;gap:8px;margin-top:16px}
.fp-btn{border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;font-weight:500;border:1px solid rgba(255,255,255,0.12)}
.fp-btn-primary{background:var(--accent);border-color:var(--accent);color:#000;flex:1}
.fp-btn-primary:hover{background:var(--accent2)}
.fp-btn-secondary{background:rgba(255,255,255,0.06);color:var(--text2);flex:1}
.fp-btn-secondary:hover{background:rgba(255,255,255,0.12);color:var(--text)}
.fp-btn-danger{background:rgba(226,75,74,0.12);border-color:rgba(226,75,74,0.3);color:#e24b4a}
.fp-btn:disabled{opacity:0.35;cursor:not-allowed}
.fp-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.fp-stat-card{background:var(--surface3);border-radius:10px;padding:13px 14px;border:1px solid rgba(255,255,255,0.05)}
.fp-stat-label{font-size:10.5px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.6px}
.fp-stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--text)}
.fp-stat-sub{font-size:11px;color:var(--text3);margin-top:3px}
.fp-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fp-bar-lbl{font-size:12px;color:var(--text2);min-width:80px;text-align:right;flex-shrink:0}
.fp-bar-track{flex:1;height:8px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden}
.fp-bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease}
.fp-bar-num{font-size:11.5px;color:var(--text3);min-width:44px;font-variant-numeric:tabular-nums}
.fp-history-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface3);border-radius:8px;border:1px solid rgba(255,255,255,0.05);margin-bottom:6px}
.fp-hi-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fp-calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fp-calc-wrap label{font-size:11.5px;color:var(--text3);display:block;margin-bottom:5px}
.fp-calc-wrap input[type=number]{background:var(--surface3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--text);outline:none;font-family:'DM Sans',sans-serif;width:100%;transition:border 0.15s}
.fp-calc-wrap input[type=number]:focus{border-color:rgba(29,185,84,0.45)}
.fp-calc-result{background:rgba(29,185,84,0.08);border:1px solid rgba(29,185,84,0.2);border-radius:10px;padding:14px 16px}
.fp-cr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.fp-cr-row:last-child{margin-bottom:0}
.fp-cr-label{font-size:12.5px;color:var(--text2)}
.fp-cr-val{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--accent)}
.save-indicator{font-size:11px;color:var(--text3);text-align:center;padding:6px;transition:all 0.3s}
.save-indicator.saved{color:var(--accent)}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->

<script>
  // ── Detect if running in Electron ────────────────────────────────────────────
const IS_ELECTRON = typeof window.electronAPI !== 'undefined'

async function saveToStorage() {
  const data = {
    playlists,
    likedIds: userTracks.filter(t => t.liked).map(t => t.id),
    trackMeta: userTracks.map(t => ({
      id: t.id, name: t.name, artist: t.artist, album: t.album,
      dur: t.dur, emoji: t.emoji, imgData: t.imgData || null,
      filename: t.filename || null
    })),
    playtime: ptState,
    savedAt: Date.now()
  }
  if (IS_ELECTRON) {
    await window.electronAPI.saveLibrary(JSON.stringify(data))
  } else {
    try { localStorage.setItem('melodix_data', JSON.stringify(data)) } catch(e) {}
  }
  showSaveFlash()
}

async function loadFromStorage() {
  if (!IS_ELECTRON) {
    try {
      var raw = localStorage.getItem('melodix_data');
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data.playlists) playlists = data.playlists;
      if (data.playtime) Object.assign(ptState, data.playtime);
      if (data.trackMeta) {
        data.trackMeta.forEach(function(meta) {
          userTracks.push({
            id: meta.id, name: meta.name, artist: meta.artist,
            album: meta.album, dur: meta.dur, emoji: meta.emoji,
            imgData: meta.imgData || null, liked: false, audioBlob: null,
            filename: meta.filename || null
          });
        });
      }
    } catch(e) { console.warn('Browser load failed', e); }
    return;
  }

  try {
    var raw = await window.electronAPI.loadLibrary();
    var files = await window.electronAPI.listSongs();

    // Build blob map from files on disk
    var blobMap = {};
    for (var i = 0; i < files.length; i++) {
      var filename = files[i];
      if (!filename) continue;
      try {
        var base64 = await window.electronAPI.readSong(filename);
        if (!base64) continue;
        var ext = filename.split('.').pop().toLowerCase();
        var mimeMap = {mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',m4a:'audio/mp4',flac:'audio/flac',aac:'audio/aac'};
        var mime = mimeMap[ext] || 'audio/mpeg';
        var binary = atob(base64);
        var arr = new Uint8Array(binary.length);
        for (var j = 0; j < binary.length; j++) arr[j] = binary.charCodeAt(j);
        var blob = new Blob([arr], {type: mime});
        blobMap[filename] = URL.createObjectURL(blob);
      } catch(e) { console.warn('Blob failed for', filename, e); }
    }

    if (!raw) {
      // No library saved — create tracks from files
      for (var i = 0; i < files.length; i++) {
        var filename = files[i];
        if (!filename) continue;
        var rawName = filename.replace(/\.[^/.]+$/, '');
        var withoutNum = rawName.replace(/^\d+\.\s*/, '');
        var withoutTag = withoutNum.replace(/\[Spotitrack\]\s*/i, '');
        var parts = withoutTag.split(' - ');
        var name = parts[0] ? parts[0].trim() : rawName;
        var artist = parts[1] ? parts.slice(1).join(' - ').trim() : 'Unknown Artist';
        userTracks.push({
          id: Date.now() + Math.random(),
          name: name, artist: artist, album: 'Imported',
          dur: 0, emoji: '🎵', imgData: null, liked: false,
          audioBlob: blobMap[filename] || null,
          filename: filename
        });
      }
      return;
    }

    // Library exists — load from saved data
    var data = JSON.parse(raw);
    if (data.playlists) playlists = data.playlists;
    if (data.playtime) Object.assign(ptState, data.playtime);
    var likedIds = data.likedIds || [];

    if (data.trackMeta && data.trackMeta.length) {
      for (var i = 0; i < data.trackMeta.length; i++) {
        var meta = data.trackMeta[i];
        userTracks.push({
          id: meta.id,
          name: meta.name,
          artist: meta.artist,
          album: meta.album || 'Imported',
          dur: meta.dur || 0,
          emoji: meta.emoji || '🎵',
          imgData: meta.imgData || null,
          liked: likedIds.indexOf(meta.id) >= 0,
          audioBlob: blobMap[meta.filename] || null,
          filename: meta.filename || null
        });
      }
    }
  } catch(e) { console.warn('Electron load failed', e); }
}

function showSaveFlash() {
  const el = document.getElementById('save-flash');
  if (!el) return;
  el.textContent = '✓ Saved';
  el.classList.add('saved');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ''; el.classList.remove('saved'); }, 2000);
}

let _saveTimer = null;
function debounceSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveToStorage, 600);
}

// ─── Data ────────────────────────────────────────────────────────────────────
let userTracks = [];
let playlists = [];
let selectedEmoji = '🎵';
let addToPlTrackIdx = null;

const EMOJIS = ['🎵','🎶','🎸','🎹','🎺','🥁','🎻','🎤','🎧','🌟','🔥','💜','🌙','🌈','🏖️','⚡','🌊','✨','😌','🚀'];

// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  currentIdx: null,
  playing: false,
  volume: 0.8,
  shuffle: false,
  repeat: false,
  currentView: 'home',
  currentPlaylist: null,
  elapsed: 0,
  timer: null,
  audioEl: null,
  queueOpen: false,
  muted: false,
  lastVol: 80,
};

// ─── Sleep Timer State ────────────────────────────────────────────────────────
let fpTimerMins=30, fpTimerSecsTotal=0, fpTimerSecsLeft=0;
let fpTimerRunning=false, fpTimerPaused=false, fpTimerInterval=null;
let fpFadeMode='none', fpCustomMins=20;
const FP_CIRC = 351.86;

// ─── Playtime State (persisted) ───────────────────────────────────────────────
let ptState = {
  totalSecs: 0,
  sessionSecs: 0,
  sessionSongs: 0,
  todaySecs: 0,
  yesterdaySecs: 0,
  weekSecs: 0,
  monthSecs: 0,
  lastDate: new Date().toDateString(),
  history: [],       // [{name,artist,cover,playedAt,dur}]
  trackStats: {},    // {trackId: {plays, totalSecs}}
};
let ptSessionInterval = null;
let ptTrackStart = null;

// ─── Helpers ─────────────────────────────────────────────────────────────────
function getAllTracks() { return [...userTracks]; }
function fmt(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return m + ':' + (sec<10?'0':'') + sec; }
function fmtMins(m) { const h=Math.floor(m/60),r=Math.round(m%60); return h>0?h+'h '+r+'min':r+'min'; }
function fmtSecs(s) {
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);
  if(h>0) return h+'h '+m+'m';
  return m+':'+( sec<10?'0':'')+sec;
}

// ─── Sidebar ─────────────────────────────────────────────────────────────────
function renderSidebar() {
  const all = getAllTracks();
  document.getElementById('playlist-sidebar').innerHTML = playlists.length === 0
    ? `<div style="padding:12px;font-size:12px;color:var(--text3);text-align:center">No playlists yet.<br>Click + to create one.</div>`
    : playlists.map((p, i) => {
        const pTracks = p.ids.map(id => all.find(t => t.id === id)).filter(Boolean);
        const thumbs = pTracks.slice(0, 4).map(t => t ? (t.imgData ? `<img src="${t.imgData}" alt="">` : `<span>${t.emoji||'🎵'}</span>`) : '');
        let thumbHtml = '';
        if (thumbs.length >= 4) {
          thumbHtml = `<div class="pl-thumb mosaic">${thumbs.join('')}</div>`;
        } else if (thumbs.length === 1 && pTracks[0]?.imgData) {
          thumbHtml = `<div class="pl-thumb"><img src="${pTracks[0].imgData}" alt=""></div>`;
        } else {
          thumbHtml = `<div class="pl-thumb">${p.emoji}</div>`;
        }
        return `<div class="playlist-item${state.currentPlaylist===i&&state.currentView==='playlist'?' active':''}" onclick="openPlaylist(${i})">
          ${thumbHtml}
          <div class="pl-info">
            <div class="pl-name">${p.name}</div>
            <div class="pl-count">${pTracks.length} songs</div>
          </div>
          <button class="pl-del-btn" onclick="event.stopPropagation();deletePlaylist(${i})" title="Delete playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
          </button>
        </div>`;
      }).join('');
}

function updateNowPlayingSidebar() {
  const all = getAllTracks();
  const npsSection = document.getElementById('nps-section');
  if (state.currentIdx === null || !all[state.currentIdx]) {
    npsSection.style.display = 'none';
    return;
  }
  npsSection.style.display = 'block';
  const t = all[state.currentIdx];
  const poster = document.getElementById('nps-poster');
  poster.innerHTML = t.imgData ? `<img src="${t.imgData}" alt="">` : `<span>${t.emoji||'🎵'}</span>`;
  document.getElementById('nps-name').textContent = t.name;
  document.getElementById('nps-artist').textContent = t.artist;
}

// ─── Views ───────────────────────────────────────────────────────────────────
function setView(v) {
  state.currentView = v;
  state.currentPlaylist = null;
  document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === ['home','search','library','liked','features'].indexOf(v)));
  renderSidebar();
  renderView();
}

function openPlaylist(i) {
  state.currentPlaylist = i;
  state.currentView = 'playlist';
  renderSidebar();
  renderView();
}

function renderView() {
  const c = document.getElementById('view-content');
  if (state.currentView === 'features') { renderFeatures(c); return; }
  ({
    home: renderHome,
    search: renderSearch,
    library: renderLibrary,
    liked: renderLiked,
    playlist: () => renderPlaylistView(state.currentPlaylist)
  })[state.currentView]?.(c);
}

function trackRowsHTML(list, showRemovePl = false, plIdx = null) {
  const all = getAllTracks();
  if (!list.length) return '';
  return list.map((t, i) => {
    const idx = all.indexOf(t);
    const isActive = state.currentIdx === idx;
    const isPlaying = isActive && state.playing;
    const missingBlob = !t.audioBlob ? `<span style="font-size:9px;background:rgba(226,75,74,0.2);color:#e24b4a;border-radius:4px;padding:1px 5px;margin-left:4px">no file</span>` : '';
    const removeBtn = showRemovePl
      ? `<button class="remove-from-pl" title="Remove from playlist" onclick="event.stopPropagation();removeFromPlaylist(${plIdx},${t.id})">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
         </button>` : '';
    return `<div class="track-row${isActive?' playing':''}" onclick="playTrack(${idx})">
      <div class="track-num">${isPlaying
        ? '<div class="playing-indicator"><span></span><span></span><span></span></div>'
        : i+1}</div>
      <div class="track-info">
        <div class="track-art">${t.imgData?`<img src="${t.imgData}" alt="">`:t.emoji||'🎵'}</div>
        <div>
          <div class="track-name">${t.name}${missingBlob}</div>
          <div class="track-artist">${t.artist}</div>
        </div>
      </div>
      <div class="track-album">${t.album||'Unknown Album'}</div>
      <div class="track-dur">${fmt(t.dur)}</div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="track-add-pl" title="Add to playlist" onclick="event.stopPropagation();showAddToPlaylist(${idx},event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        ${showRemovePl ? removeBtn : `<button class="like-btn${t.liked?' liked':''}" onclick="event.stopPropagation();toggleLike(${idx})">
          <svg viewBox="0 0 24 24" fill="${t.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        </button>`}
      </div>
    </div>`;
  }).join('');
}

function renderHome(c) {
  document.getElementById('page-title').textContent = 'Good evening 🎵';
  document.getElementById('page-sub').textContent = 'Your personal music space';
  const all = getAllTracks();
  const missing = all.filter(t=>!t.audioBlob).length;
  const missingBanner = missing>0 ? `<div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:8px;padding:10px 16px;margin:0 32px 12px;font-size:12.5px;color:#f59e0b;display:flex;align-items:center;gap:8px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    ${missing} song${missing>1?'s':''} need re-importing (audio files lost on reload). Re-import to play them.
  </div>` : '';
  if (!all.length) {
    c.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🎵</div>
      <div class="empty-title">No music yet</div>
      <div class="empty-desc">Import your music files to get started. Supports MP3, WAV, OGG, M4A, FLAC, and AAC.<br><br>Your library, playlists & stats are saved automatically.</div>
      <button class="empty-btn" onclick="triggerFileOpen()">

        Import Music
      </button>
    </div>`;

  }
  c.innerHTML = `
    ${missingBanner}
    <div style="padding:0 32px 24px">
      <button class="play-all-btn" onclick="playAll()">

        Play All

    </div>
    <div class="section-title">All Tracks</div>

      <div class="tracks-header"><span>#</span><span>Title</span><span>Album</span><span style="text-align:right">Duration</span><span></span></div>

function renderSearch(c) {
  document.getElementById('page-title').textContent = 'Search';
  document.getElementById('page-sub').textContent = 'Find songs and artists';
  c.innerHTML = `
    <div class="search-bar">
      <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
      <input placeholder="Search songs, artists..." id="search-input" oninput="filterSearch(this.value)" autofocus>
    </div>
    <div class="hero-tracks">
      <div class="tracks-header"><span>#</span><span>Title</span><span>Album</span><span style="text-align:right">Duration</span><span></span></div>
      <div id="search-results">${trackRowsHTML(getAllTracks())}</div>
    </div>`;
}

function filterSearch(q) {
  const all = getAllTracks();
  const res = q ? all.filter(t => t.name.toLowerCase().includes(q.toLowerCase()) || t.artist.toLowerCase().includes(q.toLowerCase())) : all;
  document.getElementById('search-results').innerHTML = trackRowsHTML(res);
}

function renderLibrary(c) {
  document.getElementById('page-title').textContent = 'Your Library';
  document.getElementById('page-sub').textContent = 'All your playlists';
  if (!playlists.length) {
    c.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📚</div>

      </button>
    </div>`;

  c.innerHTML = `<div style="padding:0 32px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:8px">
    ${playlists.map((p, i) => {

      const coverHtml = coverTrack
        ? `<img src="${coverTrack.imgData}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`
        : `<span style="font-size:48px">${p.emoji}</span>`;

        <div style="width:100%;aspect-ratio:1;border-radius:10px;background:rgba(29,185,84,0.1);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px">${coverHtml}</div>

      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" style="width:28px;height:28px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span style="font-size:13px;color:var(--text3)">New Playlist</span>
    </div>
  </div>`;
}

function renderLiked(c) {
  const liked = getAllTracks().filter(t => t.liked);
  document.getElementById('page-title').textContent = 'Liked Songs';
  document.getElementById('page-sub').textContent = liked.length + ' songs';
  if (!liked.length) {

      <div class="empty-icon">❤️</div>
      <div class="empty-title">No liked songs yet</div>

  c.innerHTML = `

      <div style="width:120px;height:120px;background:linear-gradient(135deg,#4c35a4,#1db954);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;flex-shrink:0;box-shadow:0 8px 32px rgba(0,0,0,0.4)">❤️</div>
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">Playlist</div>

function renderPlaylistView(i) {
  if (i === null || !playlists[i]) return;
  const c = document.getElementById('view-content');
  const p = playlists[i];
  const all = getAllTracks();
  const pTracks = p.ids.map(id => all.find(t => t.id === id)).filter(Boolean);
  document.getElementById('page-title').textContent = p.name;
  document.getElementById('page-sub').textContent = pTracks.length + ' songs';
  const coverTrack = pTracks.find(t => t?.imgData);
  const coverHtml = coverTrack
    ? `<img src="${coverTrack.imgData}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`
    : `<span style="font-size:56px">${p.emoji}</span>`;
  c.innerHTML = `
    <div style="background:linear-gradient(135deg,rgba(29,185,84,0.2),rgba(162,89,255,0.2));padding:28px 32px;display:flex;gap:20px;align-items:flex-end;margin-bottom:24px">
      <div style="width:120px;height:120px;border-radius:12px;background:rgba(29,185,84,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden">${coverHtml}</div>
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;color:var(--accent)">Playlist</div>
        <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:4px">${p.name}</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:12px">${pTracks.length} songs</div>
        ${pTracks.length ? `<button class="play-all-btn" onclick="playPlaylist(${i})">
          <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          Play

    </div>
    <div class="hero-tracks">
      ${pTracks.length
        ? `<div class="tracks-header"><span>#</span><span>Title</span><span>Album</span><span style="text-align:right">Duration</span><span></span></div>

// ─── Sleep Timer Logic ────────────────────────────────────────────────────────
function fpSetPreset(m){
  fpTimerMins=m;
  document.querySelectorAll('.fp-preset').forEach(el=>el.classList.remove('fp-active'));
  const presets=[5,15,30,45,60,90,120];
  const idx=presets.indexOf(m);
  if(idx>=0) document.querySelectorAll('.fp-preset')[idx]?.classList.add('fp-active');
  fpUpdateRingIdle();
}
function fpOnCustomSlide(v){
  fpCustomMins=parseInt(v);
  const b=document.getElementById('fp-custom-badge');
  const cv=document.getElementById('fp-custom-val');
  if(b) b.textContent=fpCustomMins+' min';
  if(cv) cv.textContent=fpCustomMins;
}
function fpUseCustom(){
  fpTimerMins=fpCustomMins;
  document.querySelectorAll('.fp-preset').forEach(el=>el.classList.remove('fp-active'));
  document.getElementById('fp-custom-tile')?.classList.add('fp-active');
  fpUpdateRingIdle();
}
function fpUpdateRingIdle(){
  const rv=document.getElementById('fp-ring-val');
  if(rv) rv.textContent=fpTimerMins>=60?Math.floor(fpTimerMins/60)+'h '+(fpTimerMins%60)+'m':fpTimerMins+'m';
  const rf=document.getElementById('fp-ring-fill');
  if(rf) rf.style.strokeDashoffset=FP_CIRC;
}
function fpSetFade(mode){
  fpFadeMode=mode;
  ['none','30','60','song'].forEach(m=>{
    document.getElementById('fp-fade-'+m)?.classList.toggle('fp-active',m===mode);
  });
}
function fpStartTimer(){
  if(fpTimerPaused){
    fpTimerRunning=true; fpTimerPaused=false;
    document.getElementById('fp-pause-btn').textContent='Pause';
    fpRunTimer(); return;
  }
  fpTimerSecsTotal=fpTimerMins*60;
  fpTimerSecsLeft=fpTimerSecsTotal;
  fpTimerRunning=true; fpTimerPaused=false;
  document.getElementById('fp-start-btn').disabled=true;
  document.getElementById('fp-pause-btn').disabled=false;
  document.getElementById('fp-cancel-btn').disabled=false;
  document.getElementById('fp-timer-badge').innerHTML='<span class="fp-badge fp-badge-green">Running</span>';
  document.getElementById('fp-ts-dot').className='ts-dot ts-running';
  document.getElementById('fp-ts-label').textContent='Timer running';
  fpRunTimer();
}
function fpRunTimer(){
  if(fpTimerInterval) clearInterval(fpTimerInterval);
  fpTimerInterval=setInterval(()=>{
    if(!fpTimerRunning) return;
    fpTimerSecsLeft=Math.max(0,fpTimerSecsLeft-1);
    fpUpdateRingDisplay();
    if(fpTimerSecsLeft<=0){ fpTimerFired(); }
    else if(fpTimerSecsLeft<=60){
      document.getElementById('fp-ts-dot').className='ts-dot ts-ending';
      document.getElementById('fp-timer-badge').innerHTML='<span class="fp-badge fp-badge-amber">Ending soon</span>';
    }
  },1000);
}
function fpUpdateRingDisplay(){
  if(!fpTimerSecsTotal) return;
  const pct=fpTimerSecsLeft/fpTimerSecsTotal;
  const rf=document.getElementById('fp-ring-fill');
  if(rf){ rf.style.strokeDashoffset=FP_CIRC*(1-pct); rf.style.stroke=fpTimerSecsLeft<=60?'#f59e0b':'var(--accent)'; }
  const m=Math.floor(fpTimerSecsLeft/60), s=fpTimerSecsLeft%60;
  const rv=document.getElementById('fp-ring-val');
  if(rv) rv.textContent=m+':'+(s<10?'0':'')+s;
  const tv=document.getElementById('fp-ts-val');
  if(tv){ tv.textContent=m+':'+(s<10?'0':'')+s; tv.style.color='var(--text)'; }
}
function fpResyncTimerUI(){
  if(!fpTimerRunning&&!fpTimerPaused) return;
  fpUpdateRingDisplay();
  document.getElementById('fp-start-btn').disabled=fpTimerRunning&&!fpTimerPaused;
  document.getElementById('fp-pause-btn').disabled=false;
  document.getElementById('fp-cancel-btn').disabled=false;
  document.getElementById('fp-timer-badge').innerHTML=fpTimerPaused?
    '<span class="fp-badge fp-badge-amber">Paused</span>':
    '<span class="fp-badge fp-badge-green">Running</span>';
  document.getElementById('fp-ts-dot').className='ts-dot'+(fpTimerRunning?' ts-running':'');
  document.getElementById('fp-ts-label').textContent=fpTimerPaused?'Timer paused':'Timer running';
}
function fpTimerFired(){
  clearInterval(fpTimerInterval); fpTimerRunning=false;
  if(state.audioEl){ state.audioEl.pause(); }
  state.playing=false; updatePlayBtn();
  const rf=document.getElementById('fp-ring-fill');
  if(rf) rf.style.strokeDashoffset=FP_CIRC;
  const rv=document.getElementById('fp-ring-val');
  if(rv) rv.textContent='0:00';
  document.getElementById('fp-timer-badge').innerHTML='<span class="fp-badge fp-badge-off">Fired</span>';
  document.getElementById('fp-ts-dot').className='ts-dot';
  document.getElementById('fp-ts-dot').style.background='#e24b4a';
  document.getElementById('fp-ts-label').textContent='Timer ended — music stopped';
  document.getElementById('fp-start-btn').disabled=false;
  document.getElementById('fp-pause-btn').disabled=true;
  document.getElementById('fp-cancel-btn').disabled=true;
  renderView();
}
function fpPauseTimer(){
  if(!fpTimerRunning) return;
  fpTimerRunning=false; fpTimerPaused=true;
  clearInterval(fpTimerInterval);
  document.getElementById('fp-pause-btn').textContent='Resume';
  document.getElementById('fp-timer-badge').innerHTML='<span class="fp-badge fp-badge-amber">Paused</span>';
  document.getElementById('fp-ts-dot').className='ts-dot';
  document.getElementById('fp-ts-dot').style.background='#f59e0b';
  document.getElementById('fp-ts-label').textContent='Timer paused';
}
function fpCancelTimer(){
  clearInterval(fpTimerInterval);
  fpTimerRunning=false; fpTimerPaused=false; fpTimerSecsLeft=0; fpTimerSecsTotal=0;
  const rf=document.getElementById('fp-ring-fill');
  if(rf) rf.style.strokeDashoffset=FP_CIRC;
  document.getElementById('fp-timer-badge').innerHTML='<span class="fp-badge fp-badge-off">Off</span>';
  document.getElementById('fp-ts-dot').className='ts-dot';
  document.getElementById('fp-ts-dot').style.background='var(--text3)';
  document.getElementById('fp-ts-label').textContent='No timer set';
  const tv=document.getElementById('fp-ts-val');
  if(tv){ tv.textContent='—'; tv.style.color='var(--text3)'; }
  document.getElementById('fp-pause-btn').textContent='Pause';
  document.getElementById('fp-start-btn').disabled=false;
  document.getElementById('fp-pause-btn').disabled=true;
  document.getElementById('fp-cancel-btn').disabled=true;
}

// ─── Playtime Tracking Logic ──────────────────────────────────────────────────
function ptCheckDateRollover(){
  const today = new Date().toDateString();
  if(ptState.lastDate !== today){
    ptState.yesterdaySecs = ptState.todaySecs;
    ptState.todaySecs = 0;
    ptState.lastDate = today;
    debounceSave();
  }
}
function ptStartTracking(t){
  ptTrackStart = Date.now();
  if(!ptSessionInterval) {
    ptSessionInterval = setInterval(()=>{
      if(!state.playing) return;
      ptState.sessionSecs++;
      ptState.totalSecs++;
      ptState.todaySecs++;
      ptState.weekSecs++;
      ptState.monthSecs++;
      if(ptState.totalSecs % 10 === 0) debounceSave();
    },1000);
  }
}
function ptStopTracking(){
  if(state.currentIdx===null || !userTracks[state.currentIdx]) return;
  const t = userTracks[state.currentIdx];
  const elapsed = ptTrackStart ? Math.round((Date.now()-ptTrackStart)/1000) : 0;
  ptTrackStart = null;
  if(elapsed < 3) return; // ignore skips under 3s
  const id = String(t.id);
  if(!ptState.trackStats[id]) ptState.trackStats[id]={plays:0,totalSecs:0};
  ptState.trackStats[id].plays++;
  ptState.trackStats[id].totalSecs += elapsed;
  ptState.sessionSongs++;
  ptState.history.unshift({
    name: t.name, artist: t.artist,
    cover: t.imgData||null,
    playedAt: Date.now(),
    dur: elapsed
  });
  if(ptState.history.length > 100) ptState.history = ptState.history.slice(0,100);
  debounceSave();
}
function fpCalcProject(){
  const spd=parseFloat(document.getElementById('fp-songs-day')?.value)||20;
  const al=parseFloat(document.getElementById('fp-avg-len')?.value)||3.5;
  const d=spd*al;
  const vals={day:d,week:d*7,month:d*30,year:d*365};
  Object.entries(vals).forEach(([k,v])=>{
    const el=document.getElementById('fp-cr-'+k);
    if(el) el.textContent=fmtMins(v);
  });
}
function fpResetStats(){
  if(!confirm('Reset all playtime stats? This cannot be undone.')) return;
  ptState.totalSecs=0; ptState.sessionSecs=0; ptState.sessionSongs=0;
  ptState.todaySecs=0; ptState.yesterdaySecs=0; ptState.weekSecs=0; ptState.monthSecs=0;
  ptState.history=[]; ptState.trackStats={};
  debounceSave();
  renderView();
}

// ─── Playback ─────────────────────────────────────────────────────────────────
function playAll() { if (getAllTracks().length) playTrack(0); }
function playPlaylist(i) {
  const all = getAllTracks();
  const idx = all.findIndex(t => t.id === playlists[i].ids[0]);
  if (idx >= 0) playTrack(idx);
}

function playTrack(idx) {
  const all = getAllTracks();
  if (idx < 0 || idx >= all.length) return;
  ptStopTracking();
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  if (state.audioEl) { state.audioEl.pause(); state.audioEl = null; }
  state.currentIdx = idx;
  state.elapsed = 0;
  state.playing = true;
  const t = all[idx];
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('cur-time').textContent = '0:00';
  document.getElementById('dur-time').textContent = fmt(t.dur);
  if (t.audioBlob) {
    state.audioEl = new Audio(t.audioBlob);
    state.audioEl.volume = state.muted ? 0 : state.volume;
    state.audioEl.play();
    state.audioEl.ontimeupdate = () => {
      state.elapsed = state.audioEl.currentTime;
      const pct = t.dur > 0 ? (state.elapsed / t.dur) * 100 : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('cur-time').textContent = fmt(state.elapsed);
    };
    state.audioEl.onended = () => {
      if (state.repeat) { state.audioEl.currentTime = 0; state.audioEl.play(); }
      else nextTrack();
    };
  }
  ptStartTracking(t);
  updateNowPlaying();
  updateNowPlayingSidebar();
  updatePlayBtn();
  updateQueue();
  renderView();
}

function togglePlay() {
  if (state.currentIdx === null) { if (getAllTracks().length) playTrack(0); return; }
  state.playing = !state.playing;
  if (state.audioEl) { state.playing ? state.audioEl.play() : state.audioEl.pause(); }
  updatePlayBtn();
  renderView();
}

function nextTrack() {
  const all = getAllTracks();
  if (!all.length) return;
  const next = state.shuffle
    ? Math.floor(Math.random() * all.length)
    : (state.currentIdx === null ? 0 : (state.currentIdx + 1) % all.length);
  playTrack(next);
}

function prevTrack() {
  const all = getAllTracks();
  if (!all.length) return;
  if (state.elapsed > 3) {
    state.elapsed = 0;
    if (state.audioEl) state.audioEl.currentTime = 0;
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('cur-time').textContent = '0:00';
    return;
  }
  const prev = state.currentIdx === null ? 0 : (state.currentIdx - 1 + all.length) % all.length;
  playTrack(prev);
}

function seekTo(e) {
  const all = getAllTracks();
  if (state.currentIdx === null) return;
  const t = all[state.currentIdx];
  const bar = document.getElementById('progress-bar');
  const pct = Math.max(0, Math.min(1, (e.clientX - bar.getBoundingClientRect().left) / bar.offsetWidth));
  state.elapsed = pct * t.dur;
  if (state.audioEl) state.audioEl.currentTime = state.elapsed;
  document.getElementById('progress-fill').style.width = (pct * 100) + '%';
  document.getElementById('cur-time').textContent = fmt(state.elapsed);
}

function toggleShuffle() {
  state.shuffle = !state.shuffle;
  document.getElementById('shuffle-btn').classList.toggle('active', state.shuffle);
}
function toggleRepeat() {
  state.repeat = !state.repeat;
  document.getElementById('repeat-btn').classList.toggle('active', state.repeat);
}

// ─── File Import ──────────────────────────────────────────────────────────────
async function triggerFileOpen() {
  if (IS_ELECTRON) {
    // Use Electron IPC — copies files permanently to userData/songs
    const imported = await window.electronAPI.importSongs();
    if (!imported || !imported.length) return;
    let processed = 0;
    imported.forEach(({ filename, path: audioPath }) => {
      const rawName = filename.replace(/\.[^/.]+$/, '');

      // Re-link to existing track if already in library
      const existing = userTracks.find(t => t.filename === filename);
      if (existing) {
        existing.audioBlob = audioPath;
        processed++;
        if (processed === imported.length) { debounceSave(); renderSidebar(); renderView(); updateQueue(); }
        return;
      }

      // New track — parse name/artist from filename
      const parts = rawName.split(' - ');
      const artist = parts.length > 1 ? parts[0] : 'Unknown Artist';
      const name = parts.length > 1 ? parts.slice(1).join(' - ') : rawName;

      const audio = new Audio(audioPath);
      audio.onloadedmetadata = () => {
        userTracks.push({
          id: Date.now() + Math.random(),
          name, artist,
          album: 'Imported',
          dur: Math.round(audio.duration) || 180,
          emoji: '🎵',
          liked: false,
          audioBlob: audioPath,
          imgData: null,
          filename,          // ← saved so scanSongs() can re-link on next launch
        });
        processed++;
        if (processed === imported.length) { debounceSave(); renderSidebar(); renderView(); updateQueue(); }
      };
      audio.onerror = () => { processed++; };
    });
  } else {
    document.getElementById('file-input').click();
  }
}

function handleFiles(e) {
  // Web / non-Electron fallback only
  const files = Array.from(e.target.files);
  let processed = 0;

  files.forEach(f => {
    const url = URL.createObjectURL(f);
    const rawName = f.name.replace(/\.[^/.]+$/, '');

    // Try to re-link to existing track
    const existing = userTracks.find(t => t.filename === f.name || t.name === rawName);
    if (existing && !existing.audioBlob) {
      existing.audioBlob = url;
      processed++;
      if (processed === files.length) { renderSidebar(); renderView(); updateQueue(); }
      return;
    }

    // New track — parse name/artist from filename
    const parts = rawName.split(' - ');
    const artist = parts.length > 1 ? parts[0] : 'Unknown Artist';
    const name = parts.length > 1 ? parts.slice(1).join(' - ') : rawName;

    const audio = new Audio(url);
    audio.onloadedmetadata = () => {
      userTracks.push({
        id: Date.now() + Math.random(),
        name, artist,
        album: 'Imported',
        dur: Math.round(audio.duration) || 180,
        emoji: '🎵',
        liked: false,
        audioBlob: url,
        imgData: null,
        filename: f.name,   // ← store filename for future re-linking
      });
      processed++;
      if (processed === files.length) { debounceSave(); renderSidebar(); renderView(); updateQueue(); }
    };
    audio.onerror = () => { processed++; };
  });
  e.target.value = '';
}

// ─── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); nextTrack(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prevTrack(); }
  if (e.code === 'KeyM') toggleMute();
  if (e.key === 'Escape') { closeCreatePlaylist(); hideDropdown(); }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
(async function() {
  await loadFromStorage();
  renderSidebar();
  renderView();
  updateQueue();
})();

</script>
